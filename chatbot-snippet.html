<!--
  Chat bot integration snippet for Ajay's portfolio
  ===================================================

  1) Upload chatbot.css and chatbot.js to your GitHub Pages repo
     (place them next to your index.html, e.g. in /myprofile/).

  2) Add the two lines below into your index.html
     - <link> goes inside <head>
     - <script defer> goes right before </body>

  3) Commit & push. The chatbot appears as a floating button
     in the bottom-right corner and automatically reads your
     portfolio content from the live page. No data is hardcoded,
     so future edits to your portfolio are picked up automatically.
-->

<link rel="stylesheet" href="chatbot.css">

<script src="chatbot.js" defer></script>
